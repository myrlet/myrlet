name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build every binary first: cross-process E2E tests spawn the sibling
      # `hub`, `worker`, and `myrlet` executables, so they must already exist.
      # `--workspace --bins` covers all three headless binaries.
      - name: Build workspace binaries
        run: cargo build --workspace --bins

      - name: Test workspace
        run: cargo test --workspace --all-targets

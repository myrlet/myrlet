name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Hub embeds `apps/web/dist`, so the Web UI is built first: every Cargo
      # step below (check, clippy, build, test) then compiles against the real
      # bundle instead of a stub, and Hub tests exercise the embedded UI.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web UI dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck Web UI
        working-directory: apps/web
        run: npm run typecheck

      - name: Test Web UI
        working-directory: apps/web
        run: npm test

      - name: Build Web UI
        working-directory: apps/web
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build every binary first: cross-process E2E tests spawn the sibling
      # `hub`, `worker`, and `myrlet` executables, so they must already exist.
      # `--workspace --bins` covers all three headless binaries.
      - name: Build workspace binaries
        run: cargo build --workspace --bins

      - name: Test workspace
        run: cargo test --workspace --all-targets

name: Release

# Publishes prebuilt `hub`, `worker`, and `myrlet` binaries for every supported
# platform. Each target is built on a native runner — x86_64 on `ubuntu-latest`,
# aarch64 Linux on `ubuntu-24.04-arm`, aarch64 macOS on `macos-latest` — so there
# is no cross compilation to babysit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARIES: hub worker myrlet

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p myrlet-hub -p myrlet-worker-daemon -p myrlet-cli

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          name="myrlet-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" dist
          for bin in $BINARIES; do
            install -m 0755 "target/${{ matrix.target }}/release/$bin" "$stage/$bin"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"

      - name: Checksum tarball
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          file="myrlet-${{ matrix.target }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$file" > "$file.sha256"
          else
            shasum -a 256 "$file" > "$file.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myrlet-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'myrlet/myrlet'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: myrlet-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -1 ./*.sha256 | LC_ALL=C sort | xargs cat > SHA256SUMS.txt
          rm -f ./*.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

name: Docker

# Builds and publishes the three OCI images as native multi-arch manifest lists:
#   ghcr.io/myrlet/hub · ghcr.io/myrlet/worker · ghcr.io/myrlet/myrlet
# Each matrix target maps 1:1 to a `Dockerfile` stage. Every platform is built on
# a matching native runner (`ubuntu-latest` / `ubuntu-24.04-arm`), so the Rust
# compile never runs under QEMU. Each `build` job pushes a single-platform image
# by digest; the `merge` job then stitches the per-architecture digests into the
# final multi-arch tags with `docker buildx imagetools create`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: myrlet

jobs:
  # One job per (image, architecture). Builds natively on the matching runner
  # and pushes the single-platform image by digest — no tags are written here.
  build:
    name: ${{ matrix.target }} (${{ matrix.arch.platform }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [hub, worker, myrlet]
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, tag_suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, tag_suffix: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Each matrix job gets its own Docker config dir. Without this, a sibling
      # job's `docker/login-action` post-step could log out `ghcr.io` mid-push.
      - name: Isolate Docker config
        run: |
          config_dir="$RUNNER_TEMP/docker"
          mkdir -p "$config_dir"
          echo "DOCKER_CONFIG=$config_dir" >> "$GITHUB_ENV"

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          use: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.repository == 'myrlet/myrlet'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only: tags are minted by the `merge` job, once per image.
      - name: Derive OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      # Pull requests (and forks) only prove that the image builds.
      - name: Build (no push)
        if: github.event_name == 'pull_request' || github.repository != 'myrlet/myrlet'
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch.tag_suffix }}
          push: false
          provenance: true

      # Canonical repo: publish this architecture's image by digest only.
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request' && github.repository == 'myrlet/myrlet'
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch.tag_suffix }}
          provenance: true

      # Hand the bare digest to the `merge` job as a one-file artifact, which is
      # Docker's documented hand-off format for multi-platform native builds.
      - name: Export digest
        if: github.event_name != 'pull_request' && github.repository == 'myrlet/myrlet'
        run: |
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p "/tmp/digests/${{ matrix.target }}"
          touch "/tmp/digests/${{ matrix.target }}/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && github.repository == 'myrlet/myrlet'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch.tag_suffix }}
          path: /tmp/digests/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 1

  # Stitch amd64 + arm64 digests into one manifest list per image and apply the
  # final tags. `latest` comes from metadata-action's built-in `latest=auto`.
  merge:
    name: merge ${{ matrix.target }}
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'myrlet/myrlet'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [hub, worker, myrlet]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.target }}-*
          path: /tmp/digests/${{ matrix.target }}
          merge-multiple: true

      - name: Isolate Docker config
        run: |
          config_dir="$RUNNER_TEMP/docker"
          mkdir -p "$config_dir"
          echo "DOCKER_CONFIG=$config_dir" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ matrix.target }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target }}:${{ steps.meta.outputs.version }}

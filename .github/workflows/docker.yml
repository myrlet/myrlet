name: Docker

# Builds and publishes the three OCI images:
#   ghcr.io/myrlet/hub · ghcr.io/myrlet/worker · ghcr.io/myrlet/myrlet
# Each matrix target maps 1:1 to a `Dockerfile` stage.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: myrlet

jobs:
  publish:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [hub, worker, myrlet]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Each matrix job gets its own Docker config dir. Without this, a sibling
      # job's `docker/login-action` post-step could log out `ghcr.io` mid-push.
      - name: Isolate Docker config
        run: |
          config_dir="$RUNNER_TEMP/docker"
          mkdir -p "$config_dir"
          echo "DOCKER_CONFIG=$config_dir" >> "$GITHUB_ENV"

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          use: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.repository == 'myrlet/myrlet'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' && github.repository == 'myrlet/myrlet' }}
          provenance: true

[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/store",
    "crates/worker",
    "crates/client",
    "apps/hub",
    "apps/worker",
    "apps/cli",
    "apps/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Myrlet Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/myrlet/myrlet"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
myrlet-protocol = { path = "crates/protocol" }
myrlet-store = { path = "crates/store" }
myrlet-worker = { path = "crates/worker" }
myrlet-client = { path = "crates/client" }

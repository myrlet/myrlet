[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/store",
    "crates/worker",
    "crates/client",
    "apps/hub",
    "apps/worker",
    "apps/cli",
    "apps/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Myrlet Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/myrlet/myrlet"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Internal workspace crates
myrlet-protocol = { path = "crates/protocol" }
myrlet-store = { path = "crates/store" }
myrlet-worker = { path = "crates/worker" }
myrlet-client = { path = "crates/client" }

# Core utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
toml = "0.8"
thiserror = "1.0"
url = "2.5"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2.43", default-features = false, features = ["std", "serde"] }
sha2 = "0.10"
subtle = "2.6"
rand = "0.8"
libc = "0.2"
tempfile = "3.27"

# Storage
rusqlite = { version = "0.41.1", features = ["bundled"] }

# HTTP / WSS / TLS
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tokio-tungstenite = "0.24"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
